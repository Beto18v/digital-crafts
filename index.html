<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- Bloquea el zoom automático del navegador en móviles al tocar el lienzo -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Título y Favicon -->
    <title>Our Digital Crafts</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23f43f5e'><path d='M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z'/></svg>" />
    <meta name="description" content="El hub digital y catálogo creativo para parejas con proyectos interactivos, recetas y lienzos compartidos." />
    
    <!-- Open Graph (WhatsApp, Telegram, iMessage) -->
    <meta property="og:title" content="Our Digital Crafts" />
    <meta property="og:description" content="El hub digital y catálogo creativo para parejas con proyectos interactivos, recetas y lienzos compartidos." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    
    <!-- Tipografías de Google Fonts optimizadas: Preconnect para acelerar el handshake DNS/TLS -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Carga no bloqueante de Google Fonts con display=swap para evitar render-blocking -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
      />
    </noscript>
  </head>
  
  <body class="bg-[#faf9f5] text-stone-800 antialiased selection:bg-rose-100 selection:text-stone-900">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
